[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "company-lab"
version = "0.1.0"
description = "Fundamentals quality + valuation ranking over the S&P 500. Advisory / shadow."
requires-python = ">=3.11,<3.13"

[tool.setuptools.packages.find]
include = ["clab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "network: test hits a live free data source (skipped by default runs)",
]
